name: DeckLink
options:
  bundleIdPrefix: com.decklink
  deploymentTarget:
    iOS: "17.0"
targets:
  DeckLink:
    type: application
    platform: iOS
    sources: [DeckLink]
    info:
      path: DeckLink/Info.plist
      properties:
        CFBundleDisplayName: DeckLink
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: DeckLink connects to your PC over your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.decklink.pair
            CFBundleURLSchemes: [decklink]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decklink.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
